version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    volumes:
      - chroma_data:${CHROMA_PATH:-/app/chroma_data}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck: # Persistent health check to ensure Ollama is running every 30 seconds
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 3s
      retries: 30

  ollama-model: 
    image: ollama/ollama
    depends_on: # Ollama must be healthy
      ollama:
        condition: service_healthy
    environment: 
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3.2:1b"] # Install the necessary model

volumes:
  chroma_data:
  ollama_data: